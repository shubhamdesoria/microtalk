name: Publish and deploy production image

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: mirotalk-production
  cancel-in-progress: false

env:
  APPLICATION: mirotalk
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/nitya-apps/mirotalk
  SBOM_ARTIFACT: sbom-mirotalk-${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Create local runtime configuration
        run: cp app/src/config.template.js app/src/config.js

      - name: Run unit tests
        run: npm test

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image for validation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: mirotalk-scan:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Scan image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: mirotalk-scan:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: mirotalk-scan:${{ github.sha }}
          format: spdx-json
          output-file: mirotalk-${{ github.sha }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.SBOM_ARTIFACT }}
          path: mirotalk-${{ github.sha }}.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Validate registry configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_BUILD_SERVICE_ACCOUNT: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
        run: |
          set -Eeuo pipefail
          for name in GCP_PROJECT_ID GCP_REGION GCP_WORKLOAD_IDENTITY_PROVIDER GCP_BUILD_SERVICE_ACCOUNT; do
            if [[ -z "${!name}" ]]; then
              printf 'Missing required repository variable: %s\n' "$name" >&2
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Publish or reuse commit image and resolve digest
        id: publish
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          tagged_image="${IMAGE}:${COMMIT_SHA}"
          local_config="$(docker image inspect "mirotalk-scan:${COMMIT_SHA}" --format '{{json .Config}}')"
          local_layers="$(docker image inspect "mirotalk-scan:${COMMIT_SHA}" --format '{{json .RootFS.Layers}}')"
          if existing_digest="$(gcloud artifacts docker images describe "${tagged_image}" \
            --format='value(image_summary.digest)' 2>/dev/null)"; then
            [[ "${existing_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
            docker pull "${tagged_image}" >/dev/null
            existing_config="$(docker image inspect "${tagged_image}" --format '{{json .Config}}')"
            existing_layers="$(docker image inspect "${tagged_image}" --format '{{json .RootFS.Layers}}')"
            existing_revision="$(docker image inspect "${tagged_image}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            existing_source="$(docker image inspect "${tagged_image}" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')"
            if [[ "${existing_config}" != "${local_config}" || "${existing_layers}" != "${local_layers}" \
              || "${existing_revision}" != "${COMMIT_SHA}" \
              || "${existing_source}" != "https://github.com/${GITHUB_REPOSITORY}" ]]; then
              printf '%s\n' 'Existing immutable tag does not match this build and source revision.' >&2
              exit 1
            fi
            DIGEST="${existing_digest}"
          else
            gcloud artifacts docker images list "${IMAGE}" --limit=1 >/dev/null
            docker tag "mirotalk-scan:${COMMIT_SHA}" "${tagged_image}"
            docker push "${tagged_image}"
            DIGEST="$(gcloud artifacts docker images describe "${tagged_image}" --format='value(image_summary.digest)')"
          fi
          [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE}@${DIGEST}" >> "${GITHUB_OUTPUT}"
          printf '{"image":"%s","digest":"%s","commit":"%s"}\n' "${IMAGE}" "${DIGEST}" "${COMMIT_SHA}" > image-metadata.json

      - name: Upload immutable image metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mirotalk-${{ github.sha }}-image
          path: image-metadata.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    if: vars.AUTOMATED_PRODUCTION_PROMOTION == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://meet.nitya-aarogya.com
    permissions:
      contents: read
    env:
      IMMUTABLE_IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - name: Create short-lived infra repository token
        id: infra-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DEPLOY_GITHUB_APP_ID }}
          private-key: ${{ secrets.DEPLOY_GITHUB_APP_PRIVATE_KEY }}
          owner: shubhamdesoria
          repositories: nitya-aarogya-infra
          permission-contents: write

      - name: Hand immutable image to infrastructure deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        with:
          github-token: ${{ steps.infra-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'shubhamdesoria',
              repo: 'nitya-aarogya-infra',
              event_type: 'promote-image',
              client_payload: {
                application: process.env.APPLICATION,
                image: process.env.IMAGE,
                source_repository: process.env.GITHUB_REPOSITORY,
                source_sha: process.env.GITHUB_SHA,
                sbom_artifact: process.env.SBOM_ARTIFACT,
              },
            });
